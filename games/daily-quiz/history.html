<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日一题</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&family=Noto+Sans+KR:wght@100..900&family=Noto+Sans+SC:wght@100..900&family=Noto+Sans+TC:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>
<div class="header">
    <a class="site-brand" href="index.html">每日一题</a>
    <nav class="top-tabs" aria-label="每日一题导航">
        <a class="top-tab" href="index.html" data-latest-quiz-link>最新问题</a>
        <a class="top-tab is-active" href="history.html" aria-current="page">历史题目</a>
    </nav>
</div>
<main class="history">
    <h1>历史题目</h1>
    <div id="history-list">加载中…</div>
</main>
<script type="module">
    const listElement = document.querySelector('#history-list');

    function quizTypeName(type) {
        const names = {
            FLIP: '翻牌',
            HAYAOSHI: '抢答',
            WADOKAICHIN: '和同开珍',
            SINGLE_CHOICE: '单选题',
            MULTIPLE_CHOICE: '多选题',
            IMAGE_TEXT: '图片题'
        };

        return names[type] ?? type;
    }

    function getShanghaiDateString() {
        const formatter = new Intl.DateTimeFormat('en-US', {
            timeZone: 'Asia/Shanghai',
            year: 'numeric',
            month: '2-digit',
            day: '2-digit'
        });
        const parts = formatter.formatToParts(new Date());
        const year = parts.find(part => part.type === 'year').value;
        const month = parts.find(part => part.type === 'month').value;
        const day = parts.find(part => part.type === 'day').value;

        return `${year}-${month}-${day}`;
    }

    function isDebugMode() {
        return ['localhost', '127.0.0.1', '::1'].includes(window.location.hostname);
    }

    fetch('./quizzes/index.json?v=' + Date.now())
        .then(response => {
            if (!response.ok) {
                throw new Error(`无法加载历史索引 (${response.status})`);
            }
            return response.json();
        })
        .then(items => {
            listElement.textContent = '';
            const today = getShanghaiDateString();
            const isDebug = isDebugMode();
            const visibleItems = items.filter(item => (
                item.date &&
                (isDebug || item.date <= today) &&
                item.type !== 'UNKNOWN'
            ));
            const latest = visibleItems
                .slice()
                .filter(item => item.date <= today)
                .sort((a, b) => b.date.localeCompare(a.date))[0];

            document.querySelectorAll('[data-latest-quiz-link]').forEach(link => {
                link.href = latest ? `index.html?date=${latest.date}` : 'index.html';
            });

            const groups = visibleItems
                .slice()
                .sort((a, b) => b.date.localeCompare(a.date))
                .reduce((result, item) => {
                    const month = item.date.slice(0, 7);
                    result[month] ??= [];
                    result[month].push(item);
                    return result;
                }, {});

            Object.entries(groups).forEach(([month, quizzes]) => {
                const section = document.createElement('section');
                const title = document.createElement('h2');
                const list = document.createElement('div');

                title.textContent = month;
                list.classList.add('history-grid');

                quizzes.forEach(quiz => {
                    const link = document.createElement('a');
                    const isFutureQuiz = quiz.date > today;
                    const params = new URLSearchParams({ date: quiz.date });
                    if (!isFutureQuiz) {
                        params.set('source', 'history_list');
                    }
                    link.href = `index.html?${params.toString()}`;
                    link.textContent = `${quiz.date} · ${quizTypeName(quiz.type)}`;
                    if (isFutureQuiz) {
                        link.classList.add('is-future-quiz');
                    }
                    list.appendChild(link);
                });

                section.appendChild(title);
                section.appendChild(list);
                listElement.appendChild(section);
            });
        })
        .catch(error => {
            listElement.textContent = error.message;
        });
</script>
</body>
</html>
